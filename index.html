<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8F0025" />
    <link rel="manifest" href="/manifest.json" />
    <title>K-SHOP | Sovereign Luxury Marketplace</title>
    <!-- Preload Hero LCP Watch Image for Instant Mobile & Desktop Paint -->
    <link
      rel="preload"
      as="image"
      href="/hero-watch.webp"
      imagesrcset="/hero-watch-mobile.webp 380w, /hero-watch.webp 600w"
      imagesizes="(max-width: 640px) 176px, (max-width: 1024px) 224px, 256px"
      type="image/webp"
      fetchpriority="high"
    />
    <!-- Google Fonts for Modern Luxury Typography (Non-render-blocking with swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" />
    </noscript>
  </head>
  <body class="bg-ivory text-stone-900 font-sans antialiased selection:bg-burgundy-100 selection:text-burgundy-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
